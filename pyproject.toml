[project]
name = "kitty3000"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ceven Jupiter Knowles", email = "160178756+CevenJKnowles@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "streamlit>=1.63.0",
]

[project.scripts]
kitty3000 = "kitty3000:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
]
